<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 포트폴리오 갤러리</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #FFD6E8 0%, #C5E3F6 50%, #E7C6FF 100%);
            background-attachment: fixed;
            color: #4A5568;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            padding-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: #2D3748;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 1rem;
            color: #718096;
            font-weight: 400;
        }

        .controls {
            max-width: 800px;
            margin: 0 auto 60px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            font-size: 0.95rem;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            outline: none;
            transition: all 0.5s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #2D3748;
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            border-color: #E7C6FF;
            box-shadow: 0 4px 12px rgba(231, 198, 255, 0.3);
            background: #FFFFFF;
        }

        .search-box input::placeholder {
            color: #A0AEC0;
        }

        .group-filter {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .group-btn {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 400;
            font-size: 0.9rem;
            transition: all 0.5s ease;
            color: #4A5568;
            backdrop-filter: blur(10px);
        }

        .group-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: #C5E3F6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(197, 227, 246, 0.3);
        }

        .group-btn.active {
            background: linear-gradient(135deg, #FFD6E8 0%, #E7C6FF 100%);
            color: #2D3748;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 214, 232, 0.4);
        }

        .stats {
            text-align: center;
            color: #718096;
            margin: 40px 0;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
            margin-bottom: 80px;
        }

        .student-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.5s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            backdrop-filter: blur(10px);
        }

        .student-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 32px rgba(197, 227, 246, 0.4);
            border-color: #C5E3F6;
            background: #FFFFFF;
        }

        .card-thumbnail {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #FFD6E8 0%, #C5E3F6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            position: relative;
            overflow: hidden;
        }

        .card-thumbnail.has-image {
            background-size: cover;
            background-position: center;
        }

        .card-thumbnail::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.1) 100%);
        }

        .student-card:nth-child(4n+1) .card-thumbnail:not(.has-image) {
            background: linear-gradient(135deg, #FFD6E8 0%, #E7C6FF 100%);
        }

        .student-card:nth-child(4n+2) .card-thumbnail:not(.has-image) {
            background: linear-gradient(135deg, #C5E3F6 0%, #B5F8FE 100%);
        }

        .student-card:nth-child(4n+3) .card-thumbnail:not(.has-image) {
            background: linear-gradient(135deg, #E7C6FF 0%, #FFD6E8 100%);
        }

        .student-card:nth-child(4n+4) .card-thumbnail:not(.has-image) {
            background: linear-gradient(135deg, #B5F8FE 0%, #C5E3F6 100%);
        }

        .card-content {
            padding: 24px;
        }

        .student-name {
            font-size: 1.25rem;
            font-weight: 500;
            color: #2D3748;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .github-id {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
        }

        .github-icon {
            width: 14px;
            height: 14px;
            opacity: 0.6;
        }

        .group-badge {
            display: inline-block;
            padding: 6px 14px;
            background: linear-gradient(135deg, #FFD6E8 0%, #E7C6FF 100%);
            border-radius: 12px;
            font-size: 0.8rem;
            color: #4A5568;
            font-weight: 400;
            margin-top: 4px;
        }

        .student-card:nth-child(4n+1) .group-badge {
            background: linear-gradient(135deg, #FFD6E8 0%, #E7C6FF 100%);
        }

        .student-card:nth-child(4n+2) .group-badge {
            background: linear-gradient(135deg, #C5E3F6 0%, #B5F8FE 100%);
        }

        .student-card:nth-child(4n+3) .group-badge {
            background: linear-gradient(135deg, #E7C6FF 0%, #FFD6E8 100%);
        }

        .student-card:nth-child(4n+4) .group-badge {
            background: linear-gradient(135deg, #B5F8FE 0%, #C5E3F6 100%);
        }

        .loading,
        .no-results,
        .error {
            text-align: center;
            color: #718096;
            font-size: 1rem;
            margin-top: 80px;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .error {
            color: #E53E3E;
            background: rgba(254, 226, 226, 0.9);
            border: 2px solid rgba(252, 165, 165, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            header {
                margin-bottom: 60px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
            }
        }

        html {
            scroll-behavior: smooth;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .loading {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .student-card {
            animation: fadeInUp 0.5s ease-out;
        }

        .student-card:nth-child(1) { animation-delay: 0.05s; }
        .student-card:nth-child(2) { animation-delay: 0.1s; }
        .student-card:nth-child(3) { animation-delay: 0.15s; }
        .student-card:nth-child(4) { animation-delay: 0.2s; }
        .student-card:nth-child(5) { animation-delay: 0.25s; }
        .student-card:nth-child(6) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>학생 포트폴리오</h1>
            <p class="subtitle">Student Portfolio Gallery</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name or GitHub ID...">
            </div>
        </div>

        <div class="group-filter" id="groupFilter"></div>

        <div class="stats">
            <span id="displayCount">0</span> of <span id="totalCount">0</span> portfolios
        </div>

        <div class="loading" id="loading">Loading data...</div>
        <div class="gallery" id="gallery" style="display: none;"></div>
        <div class="no-results" id="noResults" style="display: none;">
            No results found
        </div>
        <div class="error" id="error" style="display: none;"></div>
    </div>

    <script>
        // ========================================
        // Standalone + 보안 강화 버전
        // ========================================
        
        // ⚠️ 여기에 Google Apps Script 웹 앱 URL을 입력하세요
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyybKS3CKjg3mZW4HLB9V9DyXQcCim23qoozIYLO1Mm7SYhIdMZFt1vvK3PGFw3_P4S/exec';

        let allStudents = [];
        let filteredStudents = [];
        let currentGroup = 'all';

        function createStudentCard(student) {
            const card = document.createElement('a');
            card.className = 'student-card';
            card.href = student.siteUrl;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            
            const thumbnailStyle = student.thumbnail 
                ? `background-image: url('${student.thumbnail}');` 
                : '';
            const thumbnailClass = student.thumbnail ? 'has-image' : '';
            const thumbnailContent = student.thumbnail ? '' : student.initial;
            
            card.innerHTML = `
                <div class="card-thumbnail ${thumbnailClass}" style="${thumbnailStyle}">
                    ${thumbnailContent}
                </div>
                <div class="card-content">
                    <div class="student-name">${student.name}</div>
                    <div class="github-id">
                        <svg class="github-icon" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                        </svg>
                        @${student.githubId}
                    </div>
                    <div class="group-badge">${student.group}</div>
                </div>
            `;
            return card;
        }

        function renderGallery(studentsToRender) {
            const gallery = document.getElementById('gallery');
            const noResults = document.getElementById('noResults');
            
            gallery.innerHTML = '';
            
            if (studentsToRender.length === 0) {
                gallery.style.display = 'none';
                noResults.style.display = 'block';
            } else {
                gallery.style.display = 'grid';
                noResults.style.display = 'none';
                studentsToRender.forEach(student => {
                    gallery.appendChild(createStudentCard(student));
                });
            }

            document.getElementById('displayCount').textContent = studentsToRender.length;
        }

        function createGroupButtons(students) {
            const groupFilter = document.getElementById('groupFilter');
            const groups = ['all', ...new Set(students.map(s => s.group))];
            
            groupFilter.innerHTML = '';
            
            groups.forEach(group => {
                const btn = document.createElement('button');
                btn.className = 'group-btn';
                btn.textContent = group === 'all' ? 'All' : group;
                if (group === currentGroup) {
                    btn.classList.add('active');
                }
                
                btn.addEventListener('click', () => {
                    currentGroup = group;
                    document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    applyFilters();
                });
                
                groupFilter.appendChild(btn);
            });
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredStudents = allStudents.filter(student => {
                const matchesGroup = currentGroup === 'all' || student.group === currentGroup;
                const matchesSearch = student.name.toLowerCase().includes(searchTerm) ||
                                    student.githubId.toLowerCase().includes(searchTerm) ||
                                    student.group.toLowerCase().includes(searchTerm);
                return matchesGroup && matchesSearch;
            });
            
            renderGallery(filteredStudents);
        }

        // 보안: Origin을 포함하여 데이터 요청
        async function loadStudents() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            try {
                if (GOOGLE_APPS_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                    throw new Error('Google Apps Script URL이 설정되지 않았습니다. HTML 파일에서 URL을 입력해주세요.');
                }

                // 현재 페이지의 origin을 파라미터로 전송
                const currentOrigin = window.location.origin;
                const urlWithOrigin = `${GOOGLE_APPS_SCRIPT_URL}?origin=${encodeURIComponent(currentOrigin)}`;
                
                console.log('Fetching data from:', urlWithOrigin);
                
                const response = await fetch(urlWithOrigin);
                
                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('접근이 거부되었습니다. Apps Script의 ALLOWED_ORIGINS에 현재 도메인을 추가하세요.');
                    } else if (response.status === 429) {
                        throw new Error('너무 많은 요청이 발생했습니다. 잠시 후 다시 시도해주세요.');
                    }
                    throw new Error(`데이터를 불러오는데 실패했습니다 (${response.status})`);
                }
                
                const data = await response.json();
                
                // 에러 응답 체크
                if (data.error) {
                    throw new Error(data.error);
                }
                
                allStudents = data.students || [];
                
                if (allStudents.length === 0) {
                    throw new Error('학생 데이터가 없습니다. 구글 스프레드시트를 확인해주세요.');
                }
                
                loading.style.display = 'none';
                document.getElementById('gallery').style.display = 'grid';
                document.getElementById('totalCount').textContent = allStudents.length;
                
                createGroupButtons(allStudents);
                applyFilters();
                
            } catch (err) {
                console.error('Error:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = '❌ ' + err.message;
            }
        }

        // 검색 기능
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // 페이지 로드시 데이터 불러오기
        loadStudents();
    </script>
</body>
</html>
